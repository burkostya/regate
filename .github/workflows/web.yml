name: Web console checks
on:
  push:
  pull_request:
jobs:
  checks:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --include=dev --no-audit --no-fund
      - run: npm run check
      - run: npm run test:edges
      - run: npm run build
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser test dependencies
        run: npm ci --include=dev --no-audit --no-fund
        working-directory: web
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
        working-directory: web
      - name: Build production console
        run: npm run build
        working-directory: web
      - name: Launch demo MCP, Regate and production SvelteKit
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/regate-browser"
          go run ./cmd/regate-demo > "$RUNNER_TEMP/regate-demo.log" 2>&1 &
          ready=0
          for i in $(seq 1 90); do
            if curl -fsS http://127.0.0.1:9091/mcp -H 'Content-Type: application/json' \
              --data '{"jsonrpc":"2.0","id":1,"method":"tools/list","params":{}}' >/dev/null 2>&1; then
              ready=1
              break
            fi
            sleep 2
          done
          if [ "$ready" -ne 1 ]; then
            cat "$RUNNER_TEMP/regate-demo.log"
            exit 1
          fi
          REGATE_ADMIN_TOKEN=regate-e2e-test-token \
            go run ./cmd/regate -config ./examples/regate.hcl -state "$RUNNER_TEMP/regate-browser" \
            > "$RUNNER_TEMP/regate-server.log" 2>&1 &
          (cd web && REGATE_PROXY=http://127.0.0.1:8080 PORT=5173 HOST=127.0.0.1 node build > "$RUNNER_TEMP/regate-web.log" 2>&1) &
          ready=0
          for i in $(seq 1 90); do
            if curl -fsS http://127.0.0.1:8080/api/status \
              -H 'Authorization: Bearer regate-e2e-test-token' >/dev/null 2>&1 &&
              curl -fsS http://127.0.0.1:5173/ >/dev/null 2>&1; then
              ready=1
              break
            fi
            sleep 2
          done
          if [ "$ready" -ne 1 ]; then
            cat "$RUNNER_TEMP/regate-server.log" "$RUNNER_TEMP/regate-web.log"
            exit 1
          fi
      - name: Exercise Chromium console
        run: npm run test:e2e
        working-directory: web
        env:
          REGATE_E2E_ADMIN_TOKEN: regate-e2e-test-token
          # Mutates and restores ONLY the isolated $RUNNER_TEMP SQLite state.
          REGATE_E2E_ALLOW_ACTIVATION: 'true'
      - name: Exercise the composed scenario in Chromium
        run: go test -race ./internal/server -run '^TestV1Acceptance$/^browser$' -count=1 -v
        env:
          REGATE_V1_ACCEPTANCE_BROWSER: '1'
      - name: Preserve browser diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: chromium-regate-debug
          path: |
            web/test-results/
            ${{ runner.temp }}/regate-demo.log
            ${{ runner.temp }}/regate-server.log
            ${{ runner.temp }}/regate-web.log
          if-no-files-found: ignore
