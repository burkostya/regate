name: Formal safety checks (TLC)

on:
  push:
  pull_request:

jobs:
  tlc:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Download and verify pinned TLC 1.8.0
        run: |
          curl --fail --location --show-error --silent --retry 3 \
            -o /tmp/tla2tools.jar \
            https://github.com/tlaplus/tlaplus/releases/download/v1.8.0/tla2tools.jar
          echo 'fdffef247f563ef6edbfd44958d2a82db79e7564e07cb673262d896353fa6713  /tmp/tla2tools.jar' | sha256sum --check -
      - name: Exhaustive bounded effect lifecycle safety
        working-directory: docs/formal
        run: java -XX:+UseParallelGC -jar /tmp/tla2tools.jar -workers 1 -deadlock -config EffectLifecycle.cfg EffectLifecycle.tla
      - name: Exhaustive MCP effect receipt and contract-bound readback safety
        working-directory: docs/formal
        run: java -XX:+UseParallelGC -jar /tmp/tla2tools.jar -workers 1 -deadlock -config MCPWriteProvenance.cfg MCPWriteProvenance.tla
      - name: Exhaustive bounded parallel continuation safety
        working-directory: docs/formal
        run: java -XX:+UseParallelGC -jar /tmp/tla2tools.jar -workers 1 -deadlock -config ParallelSuspensions.cfg ParallelSuspensions.tla
      - name: Three-branch competing continuation interleavings
        working-directory: docs/formal
        run: java -XX:+UseParallelGC -jar /tmp/tla2tools.jar -workers 1 -deadlock -config ParallelSuspensions3.cfg ParallelSuspensions.tla
      - name: Join safety all/any/quorum (2 and 3 control predecessors)
        working-directory: docs/formal
        run: |
          for case in JoinSafetyAny2 JoinSafetyAll2 JoinSafetyAny3 JoinSafetyQuorum3 JoinSafetyAll3; do
            java -XX:+UseParallelGC -jar /tmp/tla2tools.jar -workers 1 -deadlock -config "$case.cfg" JoinSafety.tla
          done
