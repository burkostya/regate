name: Go compiler and runtime checks
on:
  push:
  pull_request:
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Resolve and verify module dependencies
        run: go mod tidy
      - name: Print dependency lock update (for compiler migration)
        run: |
          git diff -- go.mod go.sum
          echo 'REGATE_GO_SUM_BEGIN'
          cat go.sum
          echo 'REGATE_GO_SUM_END'
      - name: Check module files are tidy
        run: git diff --exit-code -- go.mod go.sum
      - run: go vet ./...
      - run: go test -race ./...
      - run: go build ./cmd/regate ./cmd/regate-demo
