name: Go compiler and runtime checks
on:
  push:
  pull_request:
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Resolve and verify module dependencies
        run: go mod tidy
      - name: Check module files are tidy
        run: git diff --exit-code -- go.mod go.sum
      - run: go vet ./...
      - run: go test -race ./...
      - run: go build ./cmd/regate ./cmd/regate-demo ./cmd/regate-test-mcp
      - name: Independent two-process MCP acceptance stand
        run: go test -race ./internal/server -run TestTwoProcessMCPStand -count=1 -v
