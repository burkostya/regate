name: Go compiler and runtime checks
on:
  push:
  pull_request:
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Resolve and verify module dependencies
        run: go mod tidy
      - name: Module lock for compiler migration
        run: |
          echo "=== REGATE GO.MOD ==="
          cat go.mod
          echo "=== REGATE GO.SUM ==="
          cat go.sum
          echo "=== END REGATE LOCK ==="
      - run: go vet ./...
      - run: go test -race ./...
      - run: go build ./cmd/regate ./cmd/regate-demo
